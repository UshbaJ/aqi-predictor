name: Daily Retraining

# Runs once a day: reads the latest features from the Hopsworks Feature
# Store (with local CSV fallback, per train.py's built-in logic) and
# retrains Ridge + RF models for both horizons, saving CV metrics.

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC daily - after several hourly feature updates have landed
  workflow_dispatch: {}

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt

      - name: Retrain models
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python src/train.py

      - name: Upload trained models as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-models-${{ github.run_number }}
          path: |
            src/*.pkl
            data/cv_validation_results.csv
          retention-days: 30
